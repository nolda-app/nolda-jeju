# Render 무료 플랜은 15분간 요청이 없으면 서버가 잠들어 첫 접속이 30~60초 걸린다.
# 10분마다 /health를 불러 깨워 둔다. 예약 실행은 기본 브랜치(master)에 있어야 돌고, GitHub 사정으로 몇 분씩 밀릴 수 있다.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # Actions 탭에서 손으로도 실행

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # 잠든 서버가 깨는 동안 기다리도록 넉넉히, 실패하면 몇 번 더 시도
      - run: curl -fsS --max-time 90 --retry 3 --retry-delay 10 https://nolda-backend.onrender.com/health
