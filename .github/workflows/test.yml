# PR과 master 푸시마다 프론트(타입 검사·린트·테스트·빌드)와 백엔드(pytest)를 돌린다
name: test

on:
  pull_request:
  push:
    branches: [master]

# 같은 브랜치에 새로 푸시하면 이전 실행은 취소
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # tsc -b 타입 검사 포함

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # DB·LLM 없이 가짜 데이터로 도는 테스트라 비밀 값이 필요 없다
      - run: uv run --frozen pytest
