[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
    "httpx>=0.28.1",
    "openai>=3.14.0",
    "pyjwt>=2.14.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
